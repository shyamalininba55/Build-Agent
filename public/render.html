<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deploy | Build Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#101722; --panel:#182231; --border:#304055; --text:#edf3f7; --muted:#9aaabd; --amber:#f2b84b; --blue:#6aa9ff; --code:#0c131d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; padding:48px 18px; color:var(--text); background:radial-gradient(circle at top right,#1c3045 0,transparent 38%),var(--bg); font-family:'Space Grotesk',sans-serif; }
  .page { max-width:620px; margin:0 auto; }
  .back { color:var(--muted); text-decoration:none; font:12px 'JetBrains Mono',monospace; }
  .eyebrow { margin-top:42px; color:var(--amber); font:11px 'JetBrains Mono',monospace; letter-spacing:.12em; text-transform:uppercase; }
  h1 { margin:9px 0 8px; font-size:32px; }
  .intro { color:var(--muted); line-height:1.55; margin:0 0 26px; }
  .card { padding:24px; border:1px solid var(--border); border-radius:12px; background:rgba(24,34,49,.94); box-shadow:0 18px 42px rgba(0,0,0,.32); }
  label { display:block; margin:14px 0 6px; color:var(--muted); font:11.5px 'JetBrains Mono',monospace; }
  input { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:7px; color:var(--text); background:var(--code); font:13px 'JetBrains Mono',monospace; }
  input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(106,169,255,.14); }
  button { margin-top:22px; padding:12px 18px; border:0; border-radius:7px; background:var(--amber); color:#191307; font:600 14px 'Space Grotesk',sans-serif; cursor:pointer; }
  #status { display:inline-block; margin-left:12px; color:var(--blue); font:12px 'JetBrains Mono',monospace; }
  #status.error { color:#df7770; }
</style>
</head>
<body>
<main class="page">
  <a class="back" href="/">← Back to change request</a>
  <div class="eyebrow">03 / publish</div>
  <h1>Deploy</h1>
  <p class="intro">After the pull request is reviewed and merged into <code>main</code>, return to the Build Agent result and click <strong>Deploy update</strong>.</p>
  <section class="card">
    <h2>Deploy settings</h2>
    <form id="deploySettingsForm">
      <label for="renderDeployHook">Deploy hook URL</label>
      <input id="renderDeployHook" name="RENDER_DEPLOY_HOOK_URL" type="url" placeholder="https://provider.example/deploy/..." required autocomplete="off">
      <label for="renderServiceId">Service ID</label>
      <input id="renderServiceId" name="RENDER_SERVICE_ID" type="text" placeholder="service-id" required autocomplete="off">
      <label for="deployUrl">Live site URL (<code>DEPLOY_URL</code>)</label>
      <input id="deployUrl" name="DEPLOY_URL" type="url" placeholder="https://your-app.example.com" required autocomplete="url">
      <p>Add the deployment monitoring credential directly to this repository's GitHub Actions secrets.</p>
      <button id="saveSecrets" type="submit">Save deploy settings</button><span id="status" role="status" aria-live="polite"></span>
    </form>
  </section>
</main>
<script>
const deployUrlInput = document.getElementById('deployUrl');
const deployHookInput = document.getElementById('renderDeployHook');
const status = document.getElementById('status');
deployUrlInput.value = localStorage.getItem('build-agent.deployUrl') || '';
deployHookInput.value = sessionStorage.getItem('build-agent.deployHook') || '';
deployHookInput.addEventListener('input', () => sessionStorage.setItem('build-agent.deployHook', deployHookInput.value));
document.getElementById('renderServiceId').value = localStorage.getItem('build-agent.renderServiceId') || '';
document.getElementById('deploySettingsForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const repoUrl = localStorage.getItem('build-agent.repoUrl');
  const token = localStorage.getItem('build-agent.token');
  if (!repoUrl || !token) {
    status.className = 'error';
    status.textContent = 'Save the GitHub repository and token on the GitHub page first.';
    return;
  }
  const secrets = Object.fromEntries(new FormData(event.currentTarget));
  const accessKey = localStorage.getItem('build-agent.accessKey') || '';
  const button = document.getElementById('saveSecrets');
  button.disabled = true;
  status.className = '';
  status.textContent = 'Encrypting and saving secrets...';
  try {
    const response = await fetch('/api/github/actions-secrets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(accessKey ? { 'x-access-key': accessKey } : {}) },
      body: JSON.stringify({ repoUrl, token, secrets })
    });
    const result = await response.json();
    if (!response.ok || !result.ok) {
      const saved = result.configured?.length ? ` Saved: ${result.configured.join(', ')}.` : '';
      if (response.status === 401) {
        localStorage.removeItem('build-agent.token');
        throw new Error('GitHub rejected the saved token, so it has been cleared. Save a valid token on the GitHub source page, then try again.');
      }
      throw new Error(`${result.error || 'Could not save Actions secrets.'}${saved}`);
    }
    localStorage.setItem('build-agent.deployUrl', deployUrlInput.value.trim());
    localStorage.setItem('build-agent.renderServiceId', document.getElementById('renderServiceId').value.trim());
    deployHookInput.value = '';
    status.textContent = `Saved ${result.configured.join(', ')}`;
  } catch (error) {
    status.className = 'error';
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
